  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #0f3d1a; --green-800: #1a5f2a; --green-700: #217a38; --green-600: #2d8f4a;

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; background: #fff; }

    .bottom-nav { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) - env(safe-area-max-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--gray-200); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-max-inset-bottom, 0px)); z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }

    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; background: none; border: none; color: #6b7280; font-size: 0.68rem; font-weight: 500; cursor: pointer; }
