<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Familiemajoren</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #071a10; color: #f7f4ee; font-family: Inter, sans-serif; }
    h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; }
    #board { min-height: 100vh; }
    .live-board { min-height: 100vh; padding: 36px 48px 40px; display: flex; flex-direction: column; }
    .live-kicker { display: flex; justify-content: space-between; gap: 12px; color: #e4c56a; letter-spacing: 0.14em; font-size: 0.78rem; font-weight: 700; }
    .live-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; padding: 22px 0 8px; }
    .live-hero-name { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(3.2rem, 8vw, 6.4rem); line-height: 0.9; color: #fff; }
    .live-hero-pts { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(3.6rem, 10vw, 7rem); line-height: 0.82; color: #e4c56a; }
    .live-sub { color: rgba(247,244,238,0.62); margin-top: 10px; }
    .live-rows { margin-top: 18px; }
    .live-line { display: grid; grid-template-columns: 2rem 1fr auto auto; gap: 14px; align-items: baseline; padding: 11px 0; border-top: 1px solid rgba(255,255,255,0.12); }
    .live-line b { font-weight: 500; }
    .live-gap { color: #e4c56a; }
    .live-match { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; padding: 16px 0; border-top: 1px solid rgba(255,255,255,0.12); }
    .live-match .who { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(1.7rem, 4vw, 2.8rem); line-height: 1; }
    .live-match .who.right { text-align: right; }
    .live-status { text-align: center; color: #e4c56a; font-family: 'Playfair Display', Georgia, serif; font-size: clamp(1.5rem, 3vw, 2.4rem); line-height: 1; }
    .live-status small { display: block; margin-top: 4px; font-family: Inter, sans-serif; font-size: 0.78rem; color: rgba(247,244,238,0.55); }
    .live-names { color: rgba(247,244,238,0.62); font-size: 0.95rem; margin-top: 6px; }
    .live-wait { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .live-wait h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); color: #fff; line-height: 1; }
    .live-kicker { animation: live-breathe 8s ease-in-out infinite; }
    .live-ticker { margin-top: auto; padding-top: 18px; overflow: hidden; color: rgba(247,244,238,0.72); }
    .live-ticker i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e4c56a; margin-right: 8px; }
    .live-ticker .run { display: inline-block; white-space: nowrap; animation: live-marquee 28s linear infinite; }
    .live-netbar { margin-top: auto; padding-top: 28px; overflow: hidden; }
    .live-netrun { display: flex; gap: 64px; align-items: baseline; }
    .live-netbar.scroll .live-netrun { width: max-content; animation: live-marquee 36s linear infinite; }
    .live-chip { display: inline-flex; gap: 14px; align-items: baseline; white-space: nowrap; }
    .live-chip b { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: clamp(1.4rem, 2.4vw, 2rem); }
    .live-chip i { font-style: normal; color: rgba(247,244,238,0.7); font-size: 1.25rem; }
    .live-chip em { font-style: normal; font-weight: 700; color: rgba(247,244,238,0.92); font-size: 1.35rem; }
    .live-chip em.under { color: #e4c56a; }
    .live-table .row.move { animation: live-shift 1.15s ease; }
    .live-gold { color: #e4c56a; animation: live-breathe 8s ease-in-out infinite; }
    .live-frozen .live-gold { animation: none; }
    .live-cover { position: fixed; inset: 0; z-index: 80; background: #071a10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px; }
    .live-cover h2 { font-size: clamp(3.2rem, 8vw, 7rem); color: #fff; line-height: 0.95; }
    .live-cover .big { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(4.5rem, 12vw, 9rem); color: #e4c56a; line-height: 0.85; }
    .live-cover .unit { color: rgba(247,244,238,0.62); font-size: 1.4rem; margin-left: 10px; }
    .live-cover .k { color: #e4c56a; letter-spacing: 0.16em; font-size: 0.9rem; font-weight: 700; margin-bottom: 18px; }
    .live-cover .sub { color: rgba(247,244,238,0.7); font-size: 1.6rem; margin-top: 10px; }
    .live-table { width: min(920px, 100%); text-align: left; }
    .live-table .row { display: grid; grid-template-columns: 3rem 1fr auto; gap: 16px; align-items: baseline; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.12); font-family: 'Playfair Display', Georgia, serif; font-size: clamp(1.6rem, 3vw, 2.4rem); }
    .live-cover .live-gold { animation: live-up 0.9s ease; }
    .live-story { position: absolute; left: 48px; right: 48px; bottom: 56px; z-index: 3; text-align: center; animation: live-up 0.8s ease; }
    .live-story .k { color: #e4c56a; letter-spacing: 0.16em; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; }
    .live-story p { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(1.6rem, 3vw, 2.4rem); line-height: 1.25; color: #fff; margin: 0; }
    @keyframes live-breathe { 50% { opacity: 0.72; } }
    @keyframes live-up { from { transform: translateY(28px); opacity: 0.35; } }
    @keyframes live-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes live-shift { from { transform: translateY(var(--shift, 0)); } }
    .wait { min-height: 100vh; display: flex; align-items: center; justify-content: center; letter-spacing: 0.16em; color: #e4c56a; font-weight: 700; animation: live-breathe 8s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="board"><div class="wait">FAMILIEMAJOREN</div></div>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    var NS = 'urn:x-cast:no.familiemajoren.board';
    var ctx = cast.framework.CastReceiverContext.getInstance();
    ctx.addCustomMessageListener(NS, function (event) {
      var data = event && event.data;
      if (data && data.html) document.getElementById('board').innerHTML = data.html;
    });
    var options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    options.maxInactivity = 3600;
    ctx.start(options);
  </script>
</body>
</html>
